<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Width Steganography Tool</title>

<style>
body{
    font-family: Arial;
    background:#111;
    color:white;
    padding:20px;
}

textarea{
    width:100%;
    height:120px;
    margin-top:10px;
    background:#1e1e1e;
    color:white;
    border:1px solid #333;
    padding:10px;
    border-radius:8px;
}

button{
    margin-top:10px;
    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#4a90e2;
    color:white;
    font-weight:bold;
}

.output{
    margin-top:20px;
    word-break:break-word;
    background:#1a1a1a;
    padding:10px;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>Zero Width Unicode Tool</h1>

<label>1. Văn bản hiển thị</label>
<textarea id="visible"></textarea>

<label>2. Nội dung muốn ẩn</label>
<textarea id="hidden"></textarea>

<button onclick="encodeText()">Trộn văn bản</button>
<button onclick="copyText()">Copy kết quả</button>
<button onclick="decodeText()">Giải mã</button>

<div class="output" id="result"></div>

<script>
const zw0 = "\u200B"; // zero width space
const zw1 = "\u200C"; // zero width non-joiner
const separator = "\u200D";

function textToBinary(text){
    return text.split('').map(c =>
        c.charCodeAt(0).toString(2).padStart(16,'0')
    ).join('');
}

function binaryToText(binary){
    let result = '';

    for(let i=0;i<binary.length;i+=16){
        const chunk = binary.slice(i,i+16);
        if(chunk.length < 16) continue;
        result += String.fromCharCode(parseInt(chunk,2));
    }

    return result;
}

function encodeBinary(binary){
    return binary
        .replace(/0/g, zw0)
        .replace(/1/g, zw1);
}

function decodeBinary(data){
    return data
        .replaceAll(zw0, '0')
        .replaceAll(zw1, '1');
}

function encodeText(){

    const visible = document.getElementById("visible").value;
    const hidden = document.getElementById("hidden").value;

    const binary = textToBinary(hidden);

    const encoded = encodeBinary(binary);

    const finalText = visible + separator + encoded;

    document.getElementById("result").innerText = finalText;
}

function decodeText(){

    const text = document.getElementById("result").innerText;

    const parts = text.split(separator);

    if(parts.length < 2){
        alert("Không tìm thấy dữ liệu ẩn");
        return;
    }

    const binary = decodeBinary(parts[1]);

    const hidden = binaryToText(binary);

    alert("Nội dung ẩn:\n" + hidden);
}

function copyText(){

    const text = document.getElementById("result").innerText;

    navigator.clipboard.writeText(text);

    alert("Đã copy");
}
</script>

</body>
</html>
